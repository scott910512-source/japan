<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>H×H · Gon</title>
  <defs>
    <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#0b292e"/><stop offset="1" stop-color="#244c32"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#e5f59e"/><stop offset="1" stop-color="#71b952"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#forest)"/>
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="#a5cc75" stroke-width="4" opacity=".7"/>
  <circle cx="256" cy="225" r="174" fill="url(#aura)"/>
  <circle cx="256" cy="225" r="184" fill="none" stroke="#e0eeb0" stroke-width="3" opacity=".4"/>
  <!-- Original character artwork; the SVG viewport frames the head, not a redraw. -->
  <svg x="64" y="24" width="384" height="384" viewBox="590 0 560 600" overflow="hidden">
    <image href="characters/gon.png" width="1320" height="2060"/>
  </svg>
  <rect x="108" y="358" width="296" height="108" rx="30" fill="#0b292e" stroke="#dbefb4" stroke-width="4"/>
  <!-- Keep the letters and face inside the central maskable safe area. -->
  <text x="256" y="438" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="84" font-weight="900" fill="#e6f5c9" stroke="#0b292e" stroke-width="2" paint-order="stroke">H<tspan fill="#f0a897">×</tspan>H</text>
</svg>
