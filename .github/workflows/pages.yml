name: Deploy to GitHub Pages

# ★ 검사를 통과한 커밋만 배포한다 ★
#
# 여태 이 워크플로와 「검사」가 따로 돌았다. 같은 커밋에서 둘 다 시작하고
# 서로를 안 봤으니, 검사가 깨진 채로도 배포가 나갔다 — 실제로 한 번
# 「검사 failure · Deploy success」가 같은 커밋에 나란히 찍혔다.
#
# 그래서 여기서 검사를 먼저 돌리고, 통과했을 때만 배포한다. 검사 워크플로를
# 지우지는 않는다 — PR과 작업 브랜치에서는 그쪽이 돈다. 여기서는 같은 일을
# 재사용(workflow_call)해서 한 번만 적어 둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 배포 전 관문. 여기가 깨지면 아래 deploy는 시작도 안 한다.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # anon 키는 공개돼도 되는 값이라 secret이 아니라 variable로 둔다.
          # 데이터를 지키는 건 키가 아니라 테이블의 RLS다.
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # ★ 올린 것이 다 올라갔나 ★
      #
      # 위의 검사는 방금 구운 dist를 본다 — 「코드가 맞나」다. 「올라간 것이
      # 맞나」는 다른 질문이고, 둘이 갈라지는 자리가 있다. 경로가 어긋나거나,
      # 올리기에서 파일 하나가 빠지거나, 서비스워커 캐시 목록에 적힌 파일이
      # 실제로는 없는 경우다. 마지막 것이 제일 고약하다 — 설치는 되는데
      # 그 한 줄 때문에 캐시가 통째로 실패하고 오프라인이 조용히 안 된다.
      #
      # 배포를 되돌리지는 않는다(Pages는 그럴 수단이 없다). 대신 깨졌으면
      # 여기서 빨갛게 세워서, 다음 아침에 「왜 오프라인이 안 되지」를
      # 처음부터 뒤지지 않게 한다.
      - name: 올라간 것 확인
        run: |
          # ★ 보여 주는 일과 숫자를 읽는 일을 갈라 둔다 ★
          # 처음엔 한 함수에서 tee로 둘을 같이 했는데, 그 함수를 $( ) 로 받으니
          # 로그 전체가 변수에 들어갔다 — 숫자 비교가 늘 참이 되어 멀쩡한
          # 배포도 전부 빨개졌다. 돌려 보고서야 알았다.
          show() { ./tools/live-check.sh "${{ steps.deployment.outputs.page_url }}" > /tmp/live.txt 2>&1 || true; cat /tmp/live.txt; }
          # 도구는 적어 두는 것이 목적이라 늘 0으로 끝난다. 여기서는 막아야
          # 하니 요약의 문제 수를 읽어서 판단한다.
          num()  { sed -n 's/^통과 [0-9]* \/ 문제 \([0-9]*\)$/\1/p' /tmp/live.txt | tail -1; }

          # Pages가 자리를 잡는 데 잠깐 걸린다. 바로 물으면 옛 파일이 온다.
          sleep 25
          show
          n=$(num)
          # ★ 한 번은 다시 본다 ★
          # 자리를 잡는 중에는 방금 올린 파일이 아직 404로 올 수 있다. 그걸로
          # 막으면 멀쩡한 배포가 가끔 빨개지고, 그러면 이 관문을 아무도
          # 안 믿게 된다. 정말 빠진 파일이면 두 번째에도 없다.
          if [ "${n:-1}" != "0" ]; then
            echo "한 번 더 봅니다 — 자리를 잡는 중일 수 있습니다 (문제 ${n:-?} 건)"
            sleep 30
            show
            n=$(num)
          fi
          echo "문제 ${n:-?} 건"
          if [ "${n:-1}" != "0" ]; then
            echo "::error title=배포된 파일이 모자랍니다::$(grep '✗' /tmp/live.txt | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "올라간 것이 다 올라갔습니다"
