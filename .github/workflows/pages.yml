name: Deploy to GitHub Pages

# ★ 검사를 통과한 커밋만 배포한다 ★
#
# 여태 이 워크플로와 「검사」가 따로 돌았다. 같은 커밋에서 둘 다 시작하고
# 서로를 안 봤으니, 검사가 깨진 채로도 배포가 나갔다 — 실제로 한 번
# 「검사 failure · Deploy success」가 같은 커밋에 나란히 찍혔다.
#
# 그래서 여기서 검사를 먼저 돌리고, 통과했을 때만 배포한다. 검사 워크플로를
# 지우지는 않는다 — PR과 작업 브랜치에서는 그쪽이 돈다. 여기서는 같은 일을
# 재사용(workflow_call)해서 한 번만 적어 둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 배포 전 관문. 여기가 깨지면 아래 deploy는 시작도 안 한다.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # anon 키는 공개돼도 되는 값이라 secret이 아니라 variable로 둔다.
          # 데이터를 지키는 건 키가 아니라 테이블의 RLS다.
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
