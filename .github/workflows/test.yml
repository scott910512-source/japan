name: 검사

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 순수 함수는 브라우저가 필요 없다. 먼저 돌려서 빨리 알려 준다.
      - name: 로직
        run: npm run test:logic

      # 화면 검사는 빌드한 결과물을 진짜 크롬으로 누른다.
      # playwright-core에는 브라우저가 안 들어 있다. 같은 판번호로 받아야
      # core가 그걸 찾는다.
      - name: 크롬 받기
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: 화면
        run: npm run test:ui
