name: 검사

# 작업 브랜치 푸시에서도 돌린다. PR로만 걸어 뒀더니 PR이 머지돼 닫힌 뒤로는
# 아무리 올려도 검사가 안 돌았다 — 안 도는 걸 모르는 게 제일 나쁘다.
# PR이 열려 있으면 두 번 도는데, 그 낭비가 조용히 건너뛰는 것보다 낫다.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22 이상이어야 한다. supabase-js가 붙자마자 native WebSocket을 찾는데
      # 20에는 없어서, sync를 부르는 검사가 시작도 못 하고 죽는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 순수 함수는 브라우저가 필요 없다. 먼저 돌려서 빨리 알려 준다.
      - name: 로직
        run: npm run test:logic

      # 화면 검사는 빌드한 결과물을 진짜 크롬으로 누른다.
      # playwright-core에는 브라우저가 안 들어 있다. 같은 판번호로 받아야
      # core가 그걸 찾는다.
      - name: 크롬 받기
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: 화면
        run: npm run test:ui
