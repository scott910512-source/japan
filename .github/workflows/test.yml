name: 검사

# 작업 브랜치 푸시에서도 돌린다. PR로만 걸어 뒀더니 PR이 머지돼 닫힌 뒤로는
# 아무리 올려도 검사가 안 돌았다 — 안 도는 걸 모르는 게 제일 나쁘다.
# PR이 열려 있으면 두 번 도는데, 그 낭비가 조용히 건너뛰는 것보다 낫다.
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
  # 배포(pages.yml)가 이 일을 그대로 불러 쓴다 — 배포 전 관문이다.
  # 같은 단계를 두 벌로 적어 두면 한쪽만 고쳐져서, 관문이 조용히 헐거워진다.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22 이상이어야 한다. supabase-js가 붙자마자 native WebSocket을 찾는데
      # 20에는 없어서, sync를 부르는 검사가 시작도 못 하고 죽는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 순수 함수는 브라우저가 필요 없다. 먼저 돌려서 빨리 알려 준다.
      - name: 로직
        run: npm run test:logic

      # 화면 검사는 빌드한 결과물을 진짜 크롬으로 누른다.
      # playwright-core에는 브라우저가 안 들어 있다. 같은 판번호로 받아야
      # core가 그걸 찾는다.
      - name: 크롬 받기
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: 화면
        run: npm run test:ui

      # ★ 비행기 모드 — 정보만 ★
      # test/ui/_offline-reload.js 는 이 러너에서만 떨어진다(로컬·헤드리스 셸은
      # 통과). 원인을 모르는 채로 관문에 두면 다른 검사까지 안 믿게 되니
      # 여기서는 막지 않고 돌려서 무엇이 보였는지만 적는다. 녹색이 되면
      # 밑줄을 떼고 관문으로 올린다.
      - name: 비행기 모드 (정보만)
        continue-on-error: true
        run: |
          npx vite preview --port 8933 --strictPort >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8933/japan/ && break; sleep 1; done
          APP_URL=http://localhost:8933/japan/ node test/ui/_offline-reload.js
